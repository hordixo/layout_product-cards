<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="card"
    data-qa="card"
  >
    <img
      src="./images/imac.jpeg"
      alt="Imac"
      class="card__img"
    />

    <div class="card__information">
      <h1 class="card__information-title">
        APPLE A1419 iMac 27" Retina
        <br />
        5K Monoblock (MNED2UA/A)
      </h1>
      <h2 class="card__information-code">Product code: 195434</h2>
    </div>
    <div class="card__starsrew">
      <div class="stars">
        <span class="stars__star"></span>
        <span class="stars__star"></span>
        <span class="stars__star"></span>
        <span class="stars__star"></span>
        <span class="stars__star"></span>
      </div>

      <h2 class="card__reviews">Reviews: 5</h2>
    </div>
    <div class="card__price">
      <h1 class="card__price-text">Price:</h1>
      <h2 class="card__price-amount">$2,199</h2>
    </div>
    <a
      href="#"
      class="card__button-buy"
      data-qa="hover"
    >
      buy
    </a>
  </body>
</html>
